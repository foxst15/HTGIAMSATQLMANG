<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>FoxST Cyber-Network Monitor</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <style>
    /* Hiệu ứng thanh cuộn tàng hình cho phong cách tương lai */
    ::-webkit-scrollbar { width: 6px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: #06b6d4; border-radius: 10px; }
  </style>
</head>
<body class="bg-gradient-to-br from-slate-950 via-indigo-950 to-slate-950 text-slate-100 min-h-screen p-6 font-sans">
  
  <!-- Header -->
  <header class="flex flex-col md:flex-row justify-between items-center mb-8 border-b border-cyan-900/50 pb-4">
    <div class="flex items-center gap-4">
      <div class="w-12 h-12 rounded-full bg-cyan-500/20 flex items-center justify-center border border-cyan-400 shadow-[0_0_15px_rgba(6,182,212,0.5)]">
        <span class="text-2xl">🦊</span>
      </div>
      <div>
        <h1 class="text-3xl font-black text-transparent bg-clip-text bg-gradient-to-r from-cyan-400 to-fuchsia-500 tracking-wider drop-shadow-md">
          FOXST NETWORK NOC
        </h1>
        <p class="text-xs text-cyan-200/70 font-mono">Hệ thống Giám sát Hạ tầng Không gian mạng (Mock Mode)</p>
      </div>
    </div>
    <div class="flex items-center gap-3 mt-4 md:mt-0">
      <span class="inline-flex items-center px-4 py-1.5 rounded-full text-xs font-bold bg-fuchsia-500/10 text-fuchsia-400 border border-fuchsia-500/50 shadow-[0_0_10px_rgba(217,70,239,0.3)]">
        <span class="w-2.5 h-2.5 rounded-full bg-fuchsia-400 animate-ping mr-2"></span> SYSTEM ACTIVE
      </span>
    </div>
  </header>

  <!-- Metric Cards & Tài nguyên máy chủ -->
  <section class="grid grid-cols-1 md:grid-cols-4 gap-5 mb-6">
    <div class="bg-slate-900/60 backdrop-blur-md border border-cyan-500/30 p-5 rounded-2xl shadow-lg relative overflow-hidden group hover:border-cyan-400 transition-all">
      <div class="absolute -right-6 -top-6 w-24 h-24 bg-cyan-500/10 rounded-full blur-2xl group-hover:bg-cyan-500/20"></div>
      <p class="text-xs text-cyan-400 font-mono">/ TOTAL HOSTS /</p>
      <h3 id="total-hosts" class="text-4xl font-black text-white mt-2">0</h3>
    </div>
    <div class="bg-slate-900/60 backdrop-blur-md border border-emerald-500/30 p-5 rounded-2xl shadow-lg relative overflow-hidden group hover:border-emerald-400 transition-all">
      <div class="absolute -right-6 -top-6 w-24 h-24 bg-emerald-500/10 rounded-full blur-2xl group-hover:bg-emerald-500/20"></div>
      <p class="text-xs text-emerald-400 font-mono">/ ONLINE NODES /</p>
      <h3 id="hosts-online" class="text-4xl font-black text-emerald-400 mt-2">0</h3>
    </div>
    
    <!-- Thanh RAM & CPU -->
    <div class="col-span-1 md:col-span-2 bg-slate-900/60 backdrop-blur-md border border-indigo-500/30 p-5 rounded-2xl shadow-lg flex flex-col justify-center gap-4">
      <div>
        <div class="flex justify-between text-xs font-mono text-indigo-300 mb-1">
          <span>SERVER CPU LOAD</span> <span id="cpu-text" class="text-white font-bold">45%</span>
        </div>
        <div class="w-full bg-slate-800 rounded-full h-2.5 border border-slate-700">
          <div id="cpu-bar" class="bg-gradient-to-r from-indigo-500 to-fuchsia-500 h-2.5 rounded-full transition-all duration-500" style="width: 45%"></div>
        </div>
      </div>
      <div>
        <div class="flex justify-between text-xs font-mono text-indigo-300 mb-1">
          <span>MEMORY USAGE</span> <span id="ram-text" class="text-white font-bold">60%</span>
        </div>
        <div class="w-full bg-slate-800 rounded-full h-2.5 border border-slate-700">
          <div id="ram-bar" class="bg-gradient-to-r from-cyan-500 to-blue-500 h-2.5 rounded-full transition-all duration-500" style="width: 60%"></div>
        </div>
      </div>
    </div>
  </section>

  <!-- Biểu đồ & Terminal -->
  <section class="grid grid-cols-1 lg:grid-cols-3 gap-6">
    <div class="lg:col-span-2 bg-slate-900/60 backdrop-blur-md border border-slate-700 p-5 rounded-2xl shadow-[0_0_20px_rgba(0,0,0,0.5)]">
      <h2 class="text-sm font-bold text-cyan-300 mb-4 font-mono tracking-widest">>>> BĂNG THÔNG MẠNG (LIVE)</h2>
      <div class="h-72">
        <canvas id="trafficChart"></canvas>
      </div>
    </div>
    
    <!-- Màn hình Terminal Hacker -->
    <div class="bg-black border border-green-500/40 p-4 rounded-2xl shadow-[0_0_15px_rgba(34,197,94,0.2)] flex flex-col">
      <div class="flex items-center gap-2 mb-3 border-b border-green-900 pb-2">
        <div class="w-3 h-3 rounded-full bg-rose-500 animate-pulse"></div>
        <div class="w-3 h-3 rounded-full bg-yellow-500"></div>
        <div class="w-3 h-3 rounded-full bg-emerald-500"></div>
        <span class="text-xs font-mono text-green-500 ml-2">root@foxst-syslog:~#</span>
      </div>
      <div id="terminal-log" class="font-mono text-[11px] text-green-400 space-y-1 overflow-y-auto max-h-64 flex-1 flex flex-col justify-end">
        <!-- Chữ chạy ở đây -->
      </div>
    </div>
  </section>

  <!-- Bảng Hosts -->
  <section class="mt-6 bg-slate-900/60 backdrop-blur-md border border-slate-700 p-5 rounded-2xl shadow-lg">
    <h2 class="text-sm font-bold text-cyan-300 mb-4 font-mono tracking-widest">>>> DANH SÁCH THIẾT BỊ ĐỊNH TUYẾN</h2>
    <div class="overflow-x-auto">
      <table class="w-full text-left text-xs text-slate-300">
        <thead class="bg-slate-800/80 uppercase font-mono text-cyan-400 border-b border-cyan-900">
          <tr>
            <th class="p-4">ID</th>
            <th class="p-4">Tên Thiết Bị</th>
            <th class="p-4">Địa Chỉ IP</th>
            <th class="p-4">Trạng Thái</th>
          </tr>
        </thead>
        <tbody id="hosts-table-body" class="divide-y divide-slate-800/50">
        </tbody>
      </table>
    </div>
  </section>

  <script src="/app.js"></script>
</body>
</html>
